[package]
name = "draftbench"
version = "0.2.0"
description = "Static analysis for writing"
authors = ["Draftbench contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "draftbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
harper-core = { version = "=2.11.0", default-features = false, features = ["concurrent"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = "0.7"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
